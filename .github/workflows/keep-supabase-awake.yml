name: Keep Supabase project awake

# Supabase free-tier projects auto-pause after ~7 days with no API activity,
# which breaks the chatbot (RAG + session memory both live there). This pings
# a lightweight read every 3 days so the project never goes idle long enough
# to pause, without relying on real site traffic.
on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC
  workflow_dispatch: {} # allows a manual "Run workflow" click in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/kb_documents?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Supabase did not return 200 — project may be paused or misconfigured."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
